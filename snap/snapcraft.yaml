name: heroic
title: Heroic Games Launcher
summary: An Open Source Launcher for GOG, Epic Games and Amazon Games
description: |
  Heroic is an Open Source Games Launcher. Right now it supports launching games from the Epic Games
  Store using Legendary, Amazon Games using Nile and GOG Games using our custom implementations Nile and gogdl.
adopt-info: heroic-app
icon: src/frontend/assets/heroic-icon.svg
grade: stable
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
base: core26
compression: lzo

license: GPL-3.0-only
contact: https://discord.gg/rHJ2uqdquK
issues: https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/issues
donation:
  - https://github.com/sponsors/Heroic-Games-Launcher
  - https://patreon.com/heroicgameslauncher
  - https://ko-fi.com/heroicgames
source-code: https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher
website: https://heroicgameslauncher.com/

apps:
  heroic:
    command-chain: [define-variables]
    command: opt/Heroic/heroic --no-sandbox
    desktop: usr/share/applications/heroic.desktop
    common-id: com.heroicgameslauncher.hgl
    environment:
      HOME: $SNAP_USER_COMMON
      BWRAP: $SNAP/bin/bwrap
      PRESSURE_VESSEL_BWRAP: $SNAP/bin/bwrap
      # An error in winetricks is preventing the execution from continuing.
      PROTONFIXES_DISABLE: "1"
    extensions: [gnome]
    plugs:
      - audio-playback
      - unity7
      - network
      - network-bind
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - system-observe
      - hardware-observe
      - upower-observe
      - system-backup
      - umu-support

plugs:
  shared-memory:
    private: true

layout:
  /usr/lib/mangohud:
    symlink: $SNAP/usr/lib/mangohud

parts:
  heroic-app:
    plugin: nil
    build-packages: [wget, curl, jq]
    override-build: |
      if [ "$CRAFT_ARCH_TRIPLET_BUILD_FOR" = "x86_64-linux-gnu" ]; then
        URL=$(curl -s "https://api.github.com/repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases/latest" | jq -r '.assets[] | select(.name | endswith("amd64.deb")) | .browser_download_url' | head -1)
      elif [ "$CRAFT_ARCH_TRIPLET_BUILD_FOR" = "aarch64-linux-gnu" ]; then
        URL=$(curl -s "https://api.github.com/repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases/latest" | jq -r '.assets[] | select(.name | endswith("arm64.deb")) | .browser_download_url' | head -1)
      fi

      if [ -z "$URL" ]; then
        echo "ERRO: nao encontrou URL do .deb na release mais recente" >&2
        exit 1
      fi

      wget "$URL"

      DEB_FILE=$(basename "$URL")
      dpkg-deb -x "$DEB_FILE" "$CRAFT_PART_INSTALL"
      sed -i 's|Name=Heroic Games Launcher|Name=Heroic [Snap]|' $CRAFT_PART_INSTALL/usr/share/applications/heroic.desktop
      VERSION=$(echo "$DEB_FILE" | sed -n 's/Heroic-\([0-9.]*\)-.*/\1/p')
      craftctl set version="$VERSION"
    prime:
      - usr
      - opt

  mangohud:
    after: [heroic-app]
    plugin: dump
    source: https://github.com/flightlessmango/MangoHud/releases/download/v0.8.4/MangoHud-0.8.4.r0.g992103e.tar.gz
    override-build: |
      craftctl default
      tar -xvf MangoHud-package.tar -C $CRAFT_PART_INSTALL
      sed -i 's|MANGOHUD_LIB_NAME="/usr/lib/mangohud/\\$LIB/libMangoHud_shim.so"|MANGOHUD_LIB_NAME="/usr/lib/mangohud/lib64/libMangoHud_shim.so"|' $CRAFT_PART_INSTALL/usr/bin/mangohud
    prime:
      - usr/bin
      - usr/lib/mangohud
      - usr/share

  proot-next:
    after: [mangohud]
    plugin: nil
    build-packages: [curl]
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -fsSL -o "$CRAFT_PART_INSTALL/bin/proot" \
        "https://github.com/selkies-project/proot-next/releases/download/0.3.9/proot-$(uname -m)"
      chmod +x "$CRAFT_PART_INSTALL/bin/proot"
      ln -sf proot "$CRAFT_PART_INSTALL/bin/bwrap"

  command-chain:
    after: [proot-next]
    plugin: dump
    source: $CRAFT_PROJECT_DIR/snap/command-chain/
